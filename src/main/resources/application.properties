spring.application.name=ScanToOrder
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
spring.main.allow-circular-references=true
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.repositories.enabled=false
spring.jpa.properties.hibernate.default_schema=public
paystack.secret.key=${PAYSTACK_SECRET_KEY}
paystack.base.url=${PAYSTACK_BASE_URL}
paystack.callback.url=${PAYSTACK_CALLBACK_URL}
app.frontend.url=${FRONTEND_URL}
app.seed.manager-password=${SEED_MANAGER_PASSWORD:password11}
app.seed.platform-admin-username=${PLATFORM_ADMIN_USERNAME:platformadmin}
app.seed.owner-email=${SEED_OWNER_EMAIL:}
app.seed.platform-admin-password=${PLATFORM_ADMIN_PASSWORD:platform-password11}
app.mail.from=${MAIL_FROM:no-reply@plately.local}
app.schema.allow-reset=${ALLOW_SCHEMA_RESET:false}
app.payments.allow-unsplit=${PAYMENTS_ALLOW_UNSPLIT:false}
app.charge.percent=${PLATELY_CHARGE_PERCENT:2.0}
app.charge.paystack-fee-bearer=${PAYSTACK_FEE_BEARER:account}
app.event.fee-per-guest-kobo=${EVENT_FEE_PER_GUEST_KOBO:50000}
